<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelling Bee 실전 · 말하기 버전</title>
<style>
:root{
  --ink:#241A10; --ink-soft:#6B5843;
  --honey:#F5B429; --honey-dk:#B36A05; --comb:#FDEFC9;
  --bg:#FFF9EC; --moss:#2F7D5D; --clay:#B3392C; --line:#E7D5AC;
  --ui:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --latin:"Verdana","Trebuchet MS","DejaVu Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 12% 8%,rgba(245,180,41,.16),transparent 42%),
                   radial-gradient(circle at 88% 92%,rgba(245,180,41,.12),transparent 46%);
  color:var(--ink);font-family:var(--ui);line-height:1.6;-webkit-text-size-adjust:100%;
}
.wrap{max-width:520px;margin:0 auto;padding:22px 18px 60px}
.mast{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.mast h1{font-family:var(--latin);font-weight:700;font-size:24px;margin:0}
.mast span{font-size:13px;color:var(--ink-soft)}
.tag{font-size:13px;color:var(--ink-soft);margin:0 0 16px}

.panel{background:#FFFDF6;border:1.5px solid var(--line);border-radius:18px;padding:18px 16px;margin-bottom:14px}
.panel h2{font-size:14px;margin:0 0 10px;font-weight:400;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:inherit;font-size:14px;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--honey);border-color:var(--honey-dk);font-weight:700}
.btn{font-family:inherit;font-size:15px;padding:11px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:#FFF3D6;border-color:var(--ink);font-weight:700}
.btn.wide{width:100%;font-size:17px;padding:14px}
.btn.sm{font-size:14px;padding:9px 13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.chip:focus-visible,.btn:focus-visible,.hexbtn:focus-visible{outline:3px solid var(--honey-dk);outline-offset:2px}

.meter{height:7px;background:var(--comb);border-radius:99px;overflow:hidden;margin-bottom:6px}
.meter i{display:block;height:100%;background:var(--honey-dk);width:0;transition:width .25s}
.count{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:16px}

.hexwrap{display:flex;justify-content:center;margin:4px 0 12px}
.hexbtn{width:180px;height:158px;border:0;padding:0;cursor:pointer;background:var(--honey);
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#3A2A0C;font-family:var(--ui);font-weight:700;font-size:15px}
.hexbtn .ico{font-size:40px;line-height:1}
.hexbtn.live{background:var(--clay);color:#fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}

.script{background:var(--comb);border-radius:12px;padding:10px 12px;font-size:14px;color:#5A4420;text-align:center}
.script b{font-family:var(--latin);letter-spacing:.08em}

.heard{min-height:46px;background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;font-family:var(--latin);font-size:15px;color:var(--ink-soft);word-break:break-word}
.heard.has{color:var(--ink)}

.verdict{font-family:var(--latin);font-weight:700;font-size:20px;margin:0 0 8px}
.verdict.ok{color:var(--moss)} .verdict.no{color:var(--clay)}
.spell{font-family:var(--latin);font-weight:700;font-size:26px;letter-spacing:.14em;word-break:break-all;margin-bottom:4px}
.meaning{font-size:15px;color:var(--ink-soft);margin:0 0 10px}
.sentence{font-size:15px;color:var(--ink-soft);margin:10px 0 14px}
.sentence em{color:var(--ink);font-style:normal;font-weight:700;background:var(--comb);padding:0 3px;border-radius:4px}
.parsed{font-size:13px;color:var(--ink-soft);margin:6px 0 0}
.parsed code{font-family:var(--latin);letter-spacing:.08em;background:var(--comb);padding:1px 5px;border-radius:5px}

.score{font-family:var(--latin);font-weight:700;font-size:40px;line-height:1.1;margin:0}
.score small{font-size:17px;color:var(--ink-soft);font-weight:400}
ol.misses{margin:12px 0 0;padding-left:22px}
ol.misses li{margin-bottom:7px;font-size:15px}
ol.misses b{font-family:var(--latin);letter-spacing:.04em}
ol.misses span{color:var(--ink-soft);font-size:13px}

.hide{display:none}
.note{font-size:13px;color:var(--ink-soft);margin-top:14px}
#errbar{background:var(--clay);color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="errbar" class="hide"></div>

  <div class="mast"><h1>Spelling Bee</h1><span>실전 · 말하기 버전</span></div>
  <p class="tag">단어를 듣고 <b>단어 → 철자 → 단어</b> 순서로 말하면 음성을 인식해 채점합니다.</p>

  <!-- SETUP -->
  <section id="setup">
    <div class="panel">
      <h2>연습 범위</h2>
      <div class="chips" id="rangeChips"></div>
    </div>
    <div class="panel">
      <h2>문항 수</h2>
      <div class="chips" id="sizeChips"></div>
    </div>
    <button class="btn primary wide" id="startBtn">시작하기</button>
    <p class="note">마이크 권한을 허용해야 합니다. 크롬(안드로이드·PC) 또는 사파리(아이폰)에서 열어 주세요. 조용한 곳에서 또박또박, 철자는 한 글자씩 끊어서 말하면 인식률이 높습니다.</p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hide">
    <div class="meter"><i id="bar"></i></div>
    <div class="count"><span id="pos"></span><span id="tally"></span></div>

    <div class="panel">
      <div class="hexwrap">
        <button class="hexbtn" id="micBtn"><span class="ico">🎙</span><span id="micLabel">눌러서 말하기</span></button>
      </div>
      <p class="script">말하는 순서 — <b id="scriptEx">word, w-o-r-d, word</b></p>
      <div class="btnrow" style="justify-content:center;margin-top:12px">
        <button class="btn sm" id="playBtn">단어 다시 듣기</button>
        <button class="btn sm" id="slowBtn">천천히</button>
      </div>
      <div class="btnrow" style="justify-content:center;margin-top:8px">
        <button class="btn sm" id="defBtn">Definition, please</button>
        <button class="btn sm" id="sentBtn">Use it in a sentence</button>
      </div>
      <p class="parsed" id="askInfo"></p>
    </div>

    <div class="panel" id="heardPanel">
      <div class="heard" id="heard">마이크 버튼을 누르고 또박또박 말하세요</div>
    </div>

    <div id="fbBox" class="panel hide">
      <p class="verdict" id="verdict"></p>
      <div class="spell" id="spell"></div>
      <p class="meaning" id="meaning"></p>
      <div class="btnrow">
        <button class="btn sm" id="spellOutBtn">정답 철자 듣기</button>
        <button class="btn sm" id="flipBtn"></button>
      </div>
      <p class="sentence" id="sentence"></p>
      <p class="parsed" id="fbInfo"></p>
      <button class="btn primary wide" id="nextBtn" style="margin-top:10px">다음 문제</button>
    </div>

    <button class="btn wide" id="quitBtn" style="margin-top:10px">그만하고 결과 보기</button>
  </section>

  <!-- RESULT -->
  <section id="result" class="hide">
    <div class="panel">
      <p class="score" id="scoreLine"></p>
      <p id="resultMsg" style="margin:6px 0 0;color:var(--ink-soft)"></p>
    </div>
    <div class="panel" id="missPanel">
      <h2>틀린 단어</h2>
      <ol class="misses" id="missList"></ol>
    </div>
    <button class="btn primary wide" id="retryBtn">틀린 것만 다시 하기</button>
    <button class="btn wide" id="homeBtn" style="margin-top:8px">처음으로</button>
  </section>
</div>

window.onerror=function(m,s,l){var b=document.getElementById('errbar');if(b){b.className='';b.textContent='오류: '+m+' (줄 '+l+')'}};
const el=id=>document.getElementById(id);
const TTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

/* ---------- speaking ---------- */
let voice=null;
function pickVoice(){ if(!TTS)return; const v=speechSynthesis.getVoices();
  voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/samantha|google|zira|female/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,rate){return new Promise(res=>{ if(!TTS){res();return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||.85;if(voice)u.voice=voice;u.onend=res;u.onerror=res;speechSynthesis.speak(u)}catch(e){res()} })}
function sayWord(r){return say(cur().w,r||.8)}
function spellOut(){return say(cur().w.split('').join(', '),.65)}

/* ---------- letter-name parsing ---------- */
const LETTER={ay:'a',eh:'a',bee:'b',be:'b',b:'b',see:'c',sea:'c',cee:'c',si:'c',dee:'d',de:'d',ee:'e',ea:'e',ef:'f',eff:'f',gee:'g',ge:'g',jee:'g',
aitch:'h',haitch:'h',eigh:'h',eye:'i',aye:'i',ai:'i',jay:'j',jai:'j',kay:'k',cay:'k',ka:'k',el:'l',ell:'l',le:'l',em:'m',emm:'m',en:'n',enn:'n',
oh:'o',owe:'o',ow:'o',pee:'p',pea:'p',pe:'p',cue:'q',queue:'q',kyu:'q',ar:'r',are:'r',arr:'r',er:'r',es:'s',ess:'s',esse:'s',tee:'t',tea:'t',te:'t',
you:'u',yu:'u',ewe:'u',ue:'u',vee:'v',ve:'v',vi:'v',ex:'x',eks:'x',ecks:'x',why:'y',wy:'y',wai:'y',zee:'z',zed:'z',zi:'z',zeta:'z'};
const FILLER=new Set(['is','spelled','spell','spelling','the','word','a','an','and','it','its','uh','um','please','capital','big','small']);
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

function parse(transcript,word){
  let t=' '+transcript.toLowerCase().replace(/[^a-z\s'-]/g,' ')+' ';
  t=t.replace(/-/g,' ');
  const wre=new RegExp('\\b'+esc(word.toLowerCase())+'\\b','g');
  const occ=(t.match(wre)||[]).length;
  t=t.replace(wre,' ');
  t=t.replace(/\bdouble\s+(u|you|yu|ew)\b/g,' w ');
  const toks=t.split(/\s+/).filter(Boolean);
  let out='';
  for(const tk of toks){
    if(LETTER[tk]!==undefined){out+=LETTER[tk];continue}
    if(tk.length===1&&/[a-z]/.test(tk)){out+=tk;continue}
    if(FILLER.has(tk))continue;
    out+=tk;                       // merged chunk like "ppl" or a misheard word
  }
  return {letters:out,occ:occ};
}
function grade(texts,word){
  const w=word.toLowerCase(); let best={letters:'',occ:0};
  for(const t of texts){
    const p=parse(t,word);
    if(p.letters.length>best.letters.length||!best.letters) best=p;
    if(p.letters.indexOf(w)>=0) return {ok:true,p:p};
    if(p.letters.length===0&&p.occ>=2) return {ok:true,p:p};   // spelling merged into the word
  }
  return {ok:false,p:best};
}

/* ---------- listening ---------- */
let rec=null,listening=false,texts=[],liveText='',autoStop=null;
function setMic(on){
  listening=on;
  el('micBtn').classList.toggle('live',on);
  el('micLabel').textContent=on?'말하는 중 · 눌러서 종료':'눌러서 말하기';
}
function startListen(){
  if(!SR){ warn('이 브라우저는 음성 인식을 지원하지 않습니다. 크롬이나 사파리에서 열어 주세요.'); return }
  if(TTS) speechSynthesis.cancel();
  texts=[];liveText='';
  el('heard').textContent='듣는 중…';el('heard').classList.remove('has');
  try{
    rec=new SR();
  }catch(e){ warn('음성 인식을 시작할 수 없습니다: '+e.message); return }
  rec.lang='en-US'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=5;
  rec.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal){ liveText+=' '+r[0].transcript;
        for(let k=0;k<r.length;k++) texts.push(r[k].transcript);
      } else interim+=r[0].transcript;
    }
    const any=(liveText+' '+interim).trim();
    el('heard').textContent = any ? '잘 들리고 있어요 · 다 말했으면 버튼을 다시 누르세요' : '듣는 중…';
    el('heard').classList.toggle('has', !!any);
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed') warn('마이크 권한이 거부되었습니다. 브라우저 주소창의 자물쇠 아이콘에서 마이크를 허용해 주세요.');
    else if(e.error==='no-speech') el('heard').textContent='소리가 들리지 않았어요. 다시 눌러서 말해 보세요.';
    else warn('음성 인식 오류: '+e.error);
  };
  rec.onend=()=>{ setMic(false); clearTimeout(autoStop); finishTurn(); };
  try{ rec.start(); setMic(true); }catch(e){ warn('마이크를 열 수 없습니다: '+e.message); return }
  clearTimeout(autoStop); autoStop=setTimeout(stopListen,15000);
}
function stopListen(){ if(rec&&listening){ try{rec.stop()}catch(e){ setMic(false) } } }
function warn(msg){ const b=el('errbar'); b.className=''; b.textContent=msg; }

/* ---------- state ---------- */
const RANGES=[['1–50',1,50],['51–100',51,100],['101–150',101,150],['151–200',151,200],
  ['201–250',201,250],['251–300',251,300],['기본 1–200',1,200],['챌린지 201–300',201,300],['전체 1–300',1,300]];
const SIZES=[['10문제',10],['20문제',20],['50문제',50],['전부',0]];
let rangeIdx=0,sizeIdx=0,queue=[],qi=0,right=0,misses=[],done=false,lastOk=false;
const cur=()=>queue[qi];

function chips(){
  el('rangeChips').innerHTML=RANGES.map((r,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===rangeIdx}">${r[0]}</button>`).join('');
  el('sizeChips').innerHTML=SIZES.map((s,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===sizeIdx}">${s[0]}</button>`).join('');
}
chips();
el('rangeChips').onclick=e=>{const b=e.target.closest('.chip');if(b){rangeIdx=+b.dataset.i;chips()}};
el('sizeChips').onclick=e=>{const b=e.target.closest('.chip');if(b){sizeIdx=+b.dataset.i;chips()}};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const item=i=>({n:i+1,w:WORDS[i][0],m:WORDS[i][1],s:WORDS[i][2]});

function run(items){
  queue=items;qi=0;right=0;misses=[];
  el('setup').classList.add('hide');el('result').classList.add('hide');el('quiz').classList.remove('hide');
  ask();
}
el('startBtn').onclick=()=>{
  if(TTS){try{speechSynthesis.resume();speechSynthesis.speak(new SpeechSynthesisUtterance(' '))}catch(e){}}
  if(!SR) warn('이 브라우저는 음성 인식을 지원하지 않습니다. 듣기와 정답 확인은 되지만 자동 채점은 수동 버튼으로 해 주세요.');
  const [,a,b]=RANGES[rangeIdx];
  let pool=[];for(let i=a-1;i<b;i++)pool.push(item(i));
  shuffle(pool);
  const n=SIZES[sizeIdx][1]; if(n>0)pool=pool.slice(0,n);
  run(pool);
};

function ask(){
  done=false;
  el('fbBox').classList.add('hide');el('heardPanel').classList.remove('hide');
  el('heard').textContent='마이크 버튼을 누르고 또박또박 말하세요';el('heard').classList.remove('has');
  el('askInfo').textContent='';
  el('pos').textContent=`${qi+1} / ${queue.length}번째`;
  el('tally').textContent=`맞은 개수 ${right}`;
  el('bar').style.width=(qi/queue.length*100)+'%';
  const w=cur().w;
  el('scriptEx').textContent=`${w.toLowerCase()}, ${w.toLowerCase().split('').join('-')}, ${w.toLowerCase()}`;
  el('scriptEx').style.filter='blur(5px)';
  sayWord();
}

function finishTurn(){
  if(done) return;
  if(!texts.length){ el('heard').textContent='인식된 말이 없어요. 마이크를 다시 눌러 주세요.'; return }
  done=true;
  const g=grade(texts,cur().w);
  lastOk=g.ok;
  if(g.ok) right++; else misses.push({...cur(),heard:liveText.trim()});
  show(g);
}

function show(g){
  el('heardPanel').classList.add('hide');
  el('fbBox').classList.remove('hide');
  el('scriptEx').style.filter='none';
  const v=el('verdict');
  v.textContent=lastOk?'맞았어요':'다시 볼 단어';
  v.className='verdict '+(lastOk?'ok':'no');
  el('spell').textContent=cur().w.split('').join(' ');
  el('meaning').textContent=cur().m;
  const re=new RegExp('\\b'+esc(cur().w)+'\\w*','i');
  el('sentence').innerHTML=cur().s.replace(re,m=>`<em>${m}</em>`);
  el('flipBtn').textContent=lastOk?'아니요, 틀렸어요':'아니요, 맞았어요';
  el('tally').textContent=`맞은 개수 ${right}`;
  el('fbInfo').innerHTML=`들린 말: ${liveText.trim().replace(/</g,'&lt;')||'—'}<br>철자로 읽은 것: <code>${(g.p.letters||'—')}</code>`;
}

el('flipBtn').onclick=()=>{
  if(lastOk){ right--; misses.push({...cur(),heard:liveText.trim()}); lastOk=false; }
  else { right++; const i=misses.findIndex(m=>m.n===cur().n); if(i>=0)misses.splice(i,1); lastOk=true; }
  const v=el('verdict'); v.textContent=lastOk?'맞음으로 고쳤어요':'틀림으로 고쳤어요';
  v.className='verdict '+(lastOk?'ok':'no');
  el('flipBtn').textContent=lastOk?'아니요, 틀렸어요':'아니요, 맞았어요';
  el('tally').textContent=`맞은 개수 ${right}`;
};

function next(){ qi++; if(qi>=queue.length) finish(); else ask(); }

function finish(){
  stopListen();
  el('quiz').classList.add('hide');el('result').classList.remove('hide');
  const n=qi||queue.length;
  el('bar').style.width='100%';
  el('scoreLine').innerHTML=`${right} <small>/ ${n} 개 맞음</small>`;
  const p=n?right/n:0;
  el('resultMsg').textContent=p===1?'전부 맞았어요. 다음 범위로 넘어가도 좋아요.'
    :p>=.8?'거의 다 왔어요. 틀린 것만 한 번 더 말해 보세요.'
    :'틀린 단어는 철자를 천천히 소리 내어 세 번 말한 뒤 다시 도전해 보세요.';
  if(misses.length){
    el('missPanel').classList.remove('hide');el('retryBtn').classList.remove('hide');
    el('missList').innerHTML=misses.map(m=>`<li><b>${m.w.split('').join(' ')}</b> <span>${m.m}</span><br><span>들린 말: ${(m.heard||'—').replace(/</g,'&lt;')}</span></li>`).join('');
  }else{ el('missPanel').classList.add('hide');el('retryBtn').classList.add('hide') }
}

el('micBtn').onclick=()=>{ if(listening) stopListen(); else startListen(); };
el('playBtn').onclick=()=>sayWord();
el('slowBtn').onclick=()=>sayWord(.5);
el('defBtn').onclick=()=>{ el('askInfo').textContent='뜻 — '+cur().m };
el('sentBtn').onclick=()=>say(cur().s,.85);
el('spellOutBtn').onclick=spellOut;
el('nextBtn').onclick=next;
el('quitBtn').onclick=finish;
el('retryBtn').onclick=()=>run(shuffle(misses.map(m=>item(m.n-1))));
